<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Ask questions about your study materials using your voice. Get answers in English, Tamil, or Sinhala." />
    <title>VoiceLearn AI — Voice-Powered Study Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <style>html,body,#root{min-height:100%;margin:0}#root{display:block}html{scroll-behavior:smooth}</style>
    <script>
      try {
        var stored = localStorage.getItem('vl-theme');
        var preferred = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', preferred);
      } catch (e) {}
    </script>
  </head>
  <body><noscript>Enable JavaScript to use VoiceLearn AI.</noscript><div id="root"></div></body>
</html>
