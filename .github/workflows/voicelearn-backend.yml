name: VoiceLearn Backend Checks
on:
  push:
    branches: [baskaran/expo-web-migration]
    paths:
      - 'baskaran-interactive-audio-communication/backend/**'
      - 'baskaran-interactive-audio-communication/deploy/**'
      - '.github/workflows/voicelearn-backend.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voicelearn-backend-checks
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: baskaran-interactive-audio-communication/backend
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      SUPABASE_JWT_SECRET: test-secret-for-isolated-unit-tests
      CHROMA_HOST: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: baskaran-interactive-audio-communication/backend/requirements-cloud.txt
      - name: Install cloud and test dependencies
        run: python -m pip install -r requirements-cloud.txt pytest==8.3.3 pytest-asyncio==0.24.0
      - name: Verify backend workflows and deployment preparation
        run: python -m pytest tests -q
