name: Koji CI/CD

on:
  pull_request:
    paths:
      - 'koji-interactive-infographic-generator/**'
      - '.github/workflows/koji-interactive.yml'
  push:
    branches: ['**']
    tags: ['koji-release-*']
    paths:
      - 'koji-interactive-infographic-generator/**'
      - '.github/workflows/koji-interactive.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Koji deployment target
        type: choice
        options: [all, frontend, backend]
        default: all
      deploy_models:
        description: Deploy affected Koji Modal model services
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      frontend: ${{ steps.plan.outputs.frontend }}
      backend: ${{ steps.plan.outputs.backend }}
      models: ${{ steps.plan.outputs.models }}
      frontend_tests: ${{ steps.plan.outputs.frontend_tests }}
      backend_tests: ${{ steps.plan.outputs.backend_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPLOY_TARGET: ${{ inputs.target || 'all' }}
          FORCE_MODEL_DEPLOY: ${{ inputs.deploy_models }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python koji-interactive-infographic-generator/ci/changes.py

  frontend_checks:
    needs: changes
    if: needs.changes.outputs.frontend_tests == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: koji-frontend-checks-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: koji-interactive-infographic-generator/frontend
    env:
      EXPO_PUBLIC_STUDIO_API_URL: ${{ vars.KOJI_STUDIO_API_URL }}
      EXPO_PUBLIC_STUDIO_PROXY_PATH: ${{ vars.KOJI_STUDIO_PROXY_PATH || '/studio-api' }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.KOJI_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.KOJI_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: koji-interactive-infographic-generator/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build:web -- --max-workers 2
        if: needs.changes.outputs.frontend == 'true'
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.frontend == 'true'
        with:
          name: koji-web
          path: koji-interactive-infographic-generator/frontend/dist
          if-no-files-found: error

  # Keep the existing receiver/branch-protection status name. This cheap gate
  # succeeds only when frontend checks passed or the plan did not require them.
  frontend:
    needs: [changes, frontend_checks]
    if: >-
      always() && needs.changes.result == 'success' &&
      (needs.changes.outputs.frontend_tests != 'true' || needs.frontend_checks.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Frontend checks passed or were not required for this change."

  backend:
    needs: changes
    if: needs.changes.outputs.backend_tests == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: koji-backend-checks-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koji_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: koji-interactive-infographic-generator/backend
    env:
      PYTHONPATH: .
      STUDIO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/koji_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            koji-interactive-infographic-generator/backend/studio/requirements-core.txt
            koji-interactive-infographic-generator/backend/studio/requirements-test.txt
      - run: python -m pip install -r studio/requirements-test.txt
      - run: python ../ci/check.py
      - name: Test deployment routing and artifact boundaries
        run: |
          python -c "from pathlib import Path; assert all(b'\r' not in p.read_bytes() for p in Path('../deploy/aws').glob('*.sh')), 'Deployment scripts require LF line endings'"
          for script in ../deploy/aws/*.sh; do bash -n "$script"; done
          python -m unittest discover -s ../ci/tests -p 'test_*.py'
      - name: Package tested CPU API and worker
        if: needs.changes.outputs.backend == 'true'
        run: python ../ci/package_backend.py ../release/backend.tar.gz
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.backend == 'true'
        with:
          name: koji-backend
          path: koji-interactive-infographic-generator/release/backend.tar.gz
          if-no-files-found: error

  deploy_backend:
    if: >-
      always() && needs.changes.result == 'success' && needs.backend.result == 'success' &&
      (needs.changes.outputs.frontend_tests != 'true' || needs.frontend.result == 'success') &&
      (needs.deploy_models.result == 'success' || needs.deploy_models.result == 'skipped') &&
      needs.changes.outputs.backend == 'true' &&
      vars.KOJI_EC2_DEPLOY_ENABLED == 'true' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/koji-release-')) &&
      vars.KOJI_DEPLOY_ENABLED != 'false'
    needs: [changes, frontend, backend, deploy_models]
    runs-on: ubuntu-latest
    environment: koji-production
    concurrency:
      group: koji-backend-production
      cancel-in-progress: false
    env:
      KOJI_STUDIO_API_URL: ${{ vars.KOJI_STUDIO_API_URL }}
      KOJI_DEPLOY_TOKEN: ${{ secrets.KOJI_DEPLOY_TOKEN }}
      KOJI_BACKEND_ARCHIVE: koji-interactive-infographic-generator/release/backend.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate EC2 release receiver access
        run: |
          python - <<'PY'
          import os
          required = ('KOJI_STUDIO_API_URL', 'KOJI_DEPLOY_TOKEN')
          missing = [key for key in required if not os.getenv(key, '').strip()]
          if missing:
              raise SystemExit('Configure koji-production deployment settings: ' + ', '.join(missing))
          PY
      - uses: actions/download-artifact@v4
        with:
          name: koji-backend
          path: koji-interactive-infographic-generator/release
      - name: Deploy tested API and worker with rollback
        run: python koji-interactive-infographic-generator/ci/deploy_http.py

  deploy_frontend:
    if: >-
      always() && needs.changes.result == 'success' &&
      needs.frontend.result == 'success' &&
      (needs.changes.outputs.backend_tests != 'true' || needs.backend.result == 'success') &&
      (needs.deploy_models.result == 'success' || needs.deploy_models.result == 'skipped') &&
      (needs.deploy_backend.result == 'success' || needs.deploy_backend.result == 'skipped') &&
      (needs.changes.outputs.backend != 'true' || needs.deploy_backend.result == 'success') &&
      needs.changes.outputs.frontend == 'true' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/koji-release-')) &&
      vars.KOJI_DEPLOY_ENABLED != 'false'
    needs: [changes, frontend, backend, deploy_models, deploy_backend]
    runs-on: ubuntu-latest
    environment: koji-production
    concurrency:
      group: koji-frontend-production
      cancel-in-progress: false
    env:
      EXPO_PUBLIC_STUDIO_API_URL: ${{ vars.KOJI_STUDIO_API_URL }}
      EXPO_PUBLIC_STUDIO_PROXY_PATH: ${{ vars.KOJI_STUDIO_PROXY_PATH || '/studio-api' }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.KOJI_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.KOJI_SUPABASE_ANON_KEY }}
      VERCEL_TOKEN: ${{ secrets.KOJI_VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.KOJI_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.KOJI_VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate production frontend settings
        run: |
          python - <<'PY'
          import os
          required = ('EXPO_PUBLIC_STUDIO_API_URL', 'EXPO_PUBLIC_SUPABASE_URL',
                      'EXPO_PUBLIC_SUPABASE_ANON_KEY', 'VERCEL_TOKEN', 'VERCEL_ORG_ID', 'VERCEL_PROJECT_ID')
          missing = [key for key in required if not os.getenv(key, '').strip()]
          if missing:
              raise SystemExit('Configure Koji frontend deployment settings: ' + ', '.join(missing))
          PY
      - uses: actions/download-artifact@v4
        with:
          name: koji-web
          path: koji-interactive-infographic-generator/frontend/dist
      - run: python koji-interactive-infographic-generator/ci/pack_vercel.py
      - name: Deploy tested frontend to Vercel production
        working-directory: koji-interactive-infographic-generator/frontend
        run: npx --yes vercel@63.1.2 deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
      - name: Verify frontend API proxy
        run: |
          python - <<'PY'
          import json, urllib.request
          response = json.load(urllib.request.urlopen('https://koji-studio.vercel.app/studio-api/ready', timeout=30))
          assert response['status'] == 'ok', 'Production API proxy is not ready'
          PY

  deploy_models:
    if: >-
      always() && needs.changes.result == 'success' && needs.backend.result == 'success' &&
      (needs.changes.outputs.frontend_tests != 'true' || needs.frontend.result == 'success') &&
      vars.KOJI_DEPLOY_ENABLED != 'false' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      ((needs.changes.outputs.models == 'true' && vars.KOJI_MODEL_DEPLOY_ENABLED == 'true') || inputs.deploy_models)
    needs: [changes, frontend, backend]
    runs-on: ubuntu-latest
    environment: koji-production
    concurrency:
      group: koji-models-production
      cancel-in-progress: false
    env:
      MODAL_TOKEN_ID: ${{ secrets.KOJI_MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.KOJI_MODAL_TOKEN_SECRET }}
      BEFORE_SHA: ${{ github.event.before }}
      FORCE_MODEL_DEPLOY: ${{ inputs.deploy_models }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: koji-interactive-infographic-generator/ci/deploy_models.py
      - run: pip install modal
      - run: python koji-interactive-infographic-generator/ci/deploy_models.py
